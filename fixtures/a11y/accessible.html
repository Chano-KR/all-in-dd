     brand's dist/tokens.css, or the gate's own test breaks when a token moves. -->

<title>gate 2 — accessible</title>

  body { background: #101014; color: #e8e8ee; font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 3rem; }
  a { color: #9ec1ff; }
  .btn { background: #24242e; color: #f2f2f7; border: 1px solid #3a3a48; padding: .7rem 1.2rem; font: inherit; }
</style>
<main>
  <h1>accessible</h1>
  <p>Body copy on a ground that clears the contrast floor.</p>
  <p><a href="#main">a link that names its destination</a></p>
