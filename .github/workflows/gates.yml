# The gates, run by something other than the person who wrote them.
#
# This could not exist until the suite stopped reading ~/.agents/skills: a runner has no
# skills installed, so the catalog group failed there by construction. That is also why
# nothing here installs skills — a missing skill is a fact about a workstation, and the
# rules this workflow guards are facts about the repo.
name: gates

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # the floor README states, not the newest — CI should fail where users do
          cache: npm

      - run: npm ci

      # Gate 4 drives a real browser. Without this the interactions group skips, and a
      # skipped gate on the one machine that runs every commit is the gate not existing.
      - run: npx playwright install --with-deps chromium

      - name: preflight
        run: npm run preflight

      # dist/ is gitignored, so a runner starts with none. Build first, then assert the
      # committed source and the build agree — the staleness gate has nothing to say
      # about a directory that was never generated.
      - run: npm run build:tokens
      - run: npm run check:tokens

      - name: gates — poisoned fixtures
        run: npm test
