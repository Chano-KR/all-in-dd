# The gates, run by something other than the person who wrote them.
#
# This could not exist until the suite stopped reading ~/.agents/skills: a runner has no
# skills installed, so the catalog group failed there by construction. That is also why
# nothing here installs skills — a missing skill is a fact about a workstation, and the
# rules this workflow guards are facts about the repo.
name: gates

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # the floor README states, not the newest — CI should fail where users do
          cache: npm

      - run: npm ci

      # Reads mise.toml, so the runner compiles with the version the repo pins rather than
      # whatever a package index serves that week. A typesetter upgrade is a layout change.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.16
          install: true
          cache: true

      # Gate 4 drives a real browser. Without this the interactions group skips, and a
      # skipped gate on the one machine that runs every commit is the gate not existing.
      - run: npx playwright install --with-deps chromium

      # The pool is ~50 MB of release zips. fonts.sh skips whatever is already in fonts/,
      # so a restored cache turns the fetch into a copy — the same "never re-download what
      # is present" rule preflight applies, one layer up.
      - name: cache the type pool
        uses: actions/cache@v4
        with:
          path: fonts
          key: type-pool-${{ hashFiles('scripts/fonts.sh') }}

      # Fetches the faces if the cache missed: the type pool is toolchain, not a per-brand
      # asset, so the runner needs it before anything typesets.
      - name: preflight
        run: npm run preflight

      # dist/ is gitignored, so a runner starts with none. Build first, then assert the
      # committed source and the build agree — the staleness gate has nothing to say
      # about a directory that was never generated.
      - run: npm run build:tokens
      - run: npm run check:tokens

      # README calls this the line that proves the whole chain, and until now nothing but a
      # person's own machine had ever run it.
      #
      # typst exits 0 when a face is missing — it substitutes and warns. So "the proof
      # compiled" was never the claim worth making: the first CI run produced a green
      # print step whose every line was typeset in a fallback. The warning is the failure.
      - name: print pipeline
        run: |
          set -o pipefail
          npm run print:example 2>&1 | tee print.log
          if grep -q 'unknown font family' print.log; then
            grep 'unknown font family' print.log | sort -u
            echo "::error::typst fell back — a declared face is not installed on the runner"
            exit 1
          fi

      - name: gates — poisoned fixtures
        run: npm test
