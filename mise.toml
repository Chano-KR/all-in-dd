# Toolchain for this repo. Pinned, not floating: `typst = "latest"` in a personal config
# means the version that typesets a proof today is not the one that typesets it next month,
# and print output is exactly where a silent version bump shows up as a layout diff nobody
# asked for. CI reads this same file, so the runner and the workstation compile with one
# binary rather than two that happen to agree.
#
#   mise install    installs what is pinned here
#
# Node is not pinned: README states a floor (20+) rather than a version, and CI sets its own.
[tools]
typst = "0.15.1"
