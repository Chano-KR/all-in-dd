<!doctype html>
<!-- POISONED gate 3 fixture: an animation is still running when the shutter opens, so the
     frame catches the page mid-move. The capture succeeds; what it shows is a state that
     exists for 400ms and is not the design. -->
<meta charset="utf-8">
<title>gate 3 — animating</title>
<style>
  body { background: #101014; color: #e8e8ee; font: 16px/1.6 system-ui, sans-serif;
         margin: 0; padding: 4rem; }
  h1 { font-size: 3rem; margin: 0 0 1rem; animation: drift 2s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(0) } to { transform: translateX(40px) } }
</style>
<main>
  <h1>animating</h1>
  <p>still moving when the shutter opens</p>
</main>
